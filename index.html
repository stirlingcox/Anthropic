<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Emily's Magical Butterfly Garden</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Welcome Screen -->
    <div id="welcome-screen" class="screen active">
        <div class="welcome-content">
            <div class="welcome-butterfly">🦋</div>
            <h1 class="game-title">Emily's<br>Magical Garden</h1>
            <div class="welcome-flowers">🌸 🌺 🌻 🌷 🌹</div>
            <button id="play-btn" class="play-button">
                <span class="play-text">Play!</span>
            </button>
            <div class="welcome-sparkles">
                <span class="sparkle s1">✨</span>
                <span class="sparkle s2">⭐</span>
                <span class="sparkle s3">✨</span>
                <span class="sparkle s4">💫</span>
                <span class="sparkle s5">✨</span>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen">
        <!-- Header -->
        <div class="game-header">
            <div class="star-counter">
                <span class="star-icon">⭐</span>
                <span id="star-count">0</span>
            </div>
            <div class="level-display">
                <span id="level-text">Garden 1</span>
            </div>
            <div class="butterfly-counter">
                <span class="butterfly-icon">🦋</span>
                <span id="butterfly-count">0</span>
            </div>
        </div>

        <!-- Tool Selector -->
        <div class="tool-bar">
            <button class="tool-btn active" data-tool="plant" id="tool-plant">
                <span class="tool-emoji">🌱</span>
                <span class="tool-label">Plant</span>
            </button>
            <button class="tool-btn" data-tool="water" id="tool-water">
                <span class="tool-emoji">💧</span>
                <span class="tool-label">Water</span>
            </button>
            <button class="tool-btn" data-tool="magic" id="tool-magic">
                <span class="tool-emoji">🪄</span>
                <span class="tool-label">Magic</span>
                <span class="magic-count" id="magic-count">3</span>
            </button>
        </div>

        <!-- Garden Grid -->
        <div class="garden-area">
            <div class="garden-grid" id="garden-grid">
                <!-- 9 garden plots generated by JS -->
            </div>
        </div>

        <!-- Butterfly Area (overlay) -->
        <div class="butterfly-area" id="butterfly-area">
            <!-- Butterflies spawn here -->
        </div>

        <!-- Particle Area (overlay) -->
        <div class="particle-area" id="particle-area"></div>

        <!-- Celebration Overlay -->
        <div class="celebration-overlay" id="celebration">
            <div class="celebration-content">
                <div class="celebration-emoji">🎉</div>
                <h2>Beautiful Garden!</h2>
                <p>You grew all the flowers!</p>
                <div class="celebration-stars">⭐ +10 Stars! ⭐</div>
                <button class="next-garden-btn" id="next-garden-btn">Next Garden! 🌈</button>
            </div>
        </div>

        <!-- Footer with Emily's character -->
        <div class="game-footer">
            <div class="emily-character">
                <span class="emily-emoji" id="emily">👧</span>
                <span class="emily-name">Emily</span>
            </div>
            <div class="garden-progress">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <span class="progress-text" id="progress-text">0/9 flowers</span>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
